packages:
  all:
    target: [x86_64]
    require:
      - "platform=linux"
      - "os=ubuntu24.04"
  blas:
    require: 'intel-oneapi-mkl'
  lapack:
    require: 'intel-oneapi-mkl'
  scalapack:
    require: 'intel-oneapi-mkl'
  mpi:
    # FIXME: Workaround until CE provides a full MPI replacement (as SARUS did)
    require: 'cray-mpich'
  libfabric:
    # Specify libfabric version to match the system version
    require: '@1.15.2'
  intel-oneapi-mkl:
    require:
      - 'threads=none'
      - '+cluster'
      - '+gfortran'
  openblas:
    variants:
      - 'threads=openmp'
  hwloc:
    variants:
      - '~libxml2'
  dla-future:
    require:
      - '@0.10.0'
  git:
    # Force git as non-buildable to allow deprecated versions in environments
    # https://github.com/spack/spack/pull/30040
    buildable: false
